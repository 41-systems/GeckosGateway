<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- Branding Requirement: Title is Gecko's Gateway -->
    <title>Gecko's Gateway</title>
    <style>
        :root {
            /* Clean Light Palette */
            --bg-color: #ffffff;
            --card-bg: #ffffff;
            --soft-blue: #0284c7;
            --soft-green: #059669;
            --soft-red: #dc2626;
            --soft-amber: #d97706;
            --text-color: #0f172a;
            --muted-text: #64748b;
            --muted-border: #e2e8f0;
            --box-bg: #f8fafc;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
        }

        .container {
            width: 100%;
            max-width: 820px;
            background-color: var(--card-bg);
            border: 1px solid var(--muted-border);
            border-radius: 12px;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.08), 0 8px 10px -6px rgba(0, 0, 0, 0.04);
            overflow: hidden;
        }

        /* Branding Requirement: MS Paint Header with Gecko in Overalls and Computer */
        header style="text-align: center; padding: 20px; font-family: 'Courier New', monospace;">
          <h1 style="font-size: 2.5rem; color: #008080; text-transform: uppercase; letter-spacing: 2px;">
            🦎 Gecko's Gateway 🦎
          </h1>
          <p style="font-size: 1.1rem; color: #555;">Network & DNS Security Suite - Slightly Questionable V1.4</p>
        </header>

        <div style="display: flex; justify-content: center; margin: 20px 0; border-bottom: 1px solid var(--muted-border); padding-bottom: 20px;">
          <svg width="320" height="260" viewBox="0 0 320 260" xmlns="http://www.w3.org/2000/svg" style="border: 3px inset #c0c0c0; background-color: #ffffff;">
            <defs>
              <!-- MS Paint Spray Paint Pattern -->
              <pattern id="spray" width="20" height="20" patternUnits="userSpaceOnUse">
                <circle cx="2" cy="3" r="1" fill="#00aa00"/>
                <circle cx="8" cy="12" r="1.5" fill="#008800"/>
                <circle cx="15" cy="5" r="1" fill="#00aa00"/>
                <circle cx="11" cy="17" r="1" fill="#006600"/>
                <circle cx="5" cy="18" r="1.2" fill="#00aa00"/>
              </pattern>
            </defs>

            <!-- Background Grid Lines (MS Paint Canvas vibe) -->
            <rect width="320" height="260" fill="#ffffff" />
            
            <!-- Old CRT Monitor Body -->
            <rect x="180" y="80" width="110" height="90" fill="#e0e0d0" stroke="#000000" stroke-width="4" stroke-linejoin="bevel" />
            <!-- Monitor Bezel -->
            <rect x="190" y="90" width="90" height="70" fill="#c0c0b0" stroke="#000000" stroke-width="3" />
            <!-- Glowing Green Screen -->
            <rect x="198" y="98" width="74" height="54" fill="#002200" stroke="#000000" stroke-width="2" />
            <!-- Crude Code lines on monitor -->
            <path d="M 204 108 L 240 108 M 204 116 L 260 116 M 204 124 L 230 124 M 204 132 L 250 132" stroke="#00ff00" stroke-width="3" stroke-linecap="square" />
            <!-- Monitor Stand -->
            <polygon points="210,170 260,170 270,190 200,190" fill="#c0c0b0" stroke="#000000" stroke-width="3" />
            <!-- Computer Tower -->
            <rect x="250" y="140" width="50" height="80" fill="#d0d0c0" stroke="#000000" stroke-width="4" />
            <line x1="260" y1="155" x2="290" y2="155" stroke="#000" stroke-width="3" /> <!-- Floppy Drive -->
            <circle cx="285" cy="200" r="4" fill="#ff0000" /> <!-- Power Button -->

            <!-- Gecko Tail -->
            <path d="M 50 190 Q 20 200 15 160 Q 10 120 40 150 Q 60 170 80 180" fill="none" stroke="#00aa00" stroke-width="14" stroke-linecap="round" />
            <path d="M 50 190 Q 20 200 15 160 Q 10 120 40 150 Q 60 170 80 180" fill="none" stroke="#000000" stroke-width="3" />

            <!-- Gecko Body (Green Spray/Fill) -->
            <ellipse cx="100" cy="170" rx="35" ry="45" fill="#00cc00" stroke="#000000" stroke-width="4" />
            <ellipse cx="100" cy="170" rx="35" ry="45" fill="url(#spray)" />

            <!-- Gecko Head -->
            <polygon points="75,120 125,120 135,90 85,85" fill="#00cc00" stroke="#000000" stroke-width="4" stroke-linejoin="round" />
            <!-- Big Derpy Eyes -->
            <circle cx="90" cy="90" r="14" fill="#ffffff" stroke="#000000" stroke-width="3" />
            <circle cx="92" cy="88" r="4" fill="#000000" /> <!-- Pupil 1 -->
            <circle cx="120" cy="95" r="14" fill="#ffffff" stroke="#000000" stroke-width="3" />
            <circle cx="124" cy="97" r="4" fill="#000000" /> <!-- Pupil 2 (Derpy look) -->
            <!-- Tongue sticking out -->
            <path d="M 115 110 Q 135 115 140 125 Q 145 135 138 135 Q 130 135 120 115" fill="#ff3366" stroke="#000000" stroke-width="2" />

            <!-- Overalls (Blue Denim with Yellow Buckles) -->
            <!-- Main Pants Body -->
            <path d="M 70 160 L 130 160 L 135 210 L 65 210 Z" fill="#0055ff" stroke="#000000" stroke-width="4" />
            <!-- Overalls Bib -->
            <rect x="80" y="135" width="40" height="30" fill="#0055ff" stroke="#000000" stroke-width="3" />
            <!-- Left Strap -->
            <line x1="82" y1="135" x2="75" y2="105" stroke="#0055ff" stroke-width="8" />
            <line x1="82" y1="135" x2="75" y2="105" stroke="#000000" stroke-width="2" />
            <!-- Right Strap -->
            <line x1="118" y1="135" x2="125" y2="105" stroke="#0055ff" stroke-width="8" />
            <line x1="118" y1="135" x2="125" y2="105" stroke="#000000" stroke-width="2" />
            <!-- Strap Buttons -->
            <circle cx="83" cy="138" r="3" fill="#ffff00" stroke="#000000" stroke-width="1" />
            <circle cx="117" cy="138" r="3" fill="#ffff00" stroke="#000000" stroke-width="1" />
            <!-- Center Pocket -->
            <rect x="92" y="142" width="16" height="15" fill="none" stroke="#000000" stroke-width="2" stroke-dasharray="2,2" />

            <!-- Gecko Arms/Hands reaching for keyboard -->
            <path d="M 120 150 Q 150 160 175 175" fill="none" stroke="#00aa00" stroke-width="8" stroke-linecap="round" />
            <path d="M 120 150 Q 150 160 175 175" fill="none" stroke="#000000" stroke-width="3" stroke-linecap="round" />

            <!-- Keyboard -->
            <polygon points="160,185 240,185 230,205 150,205" fill="#d0d0c0" stroke="#000000" stroke-width="3" />
            <!-- Keyboard Keys (Scribbly lines) -->
            <path d="M 165 190 L 230 190 M 162 195 L 227 195 M 160 200 L 222 200" stroke="#555" stroke-width="2" stroke-dasharray="3,2" />

            <!-- MS Paint "Spray Paint" accidental splotches in corner -->
            <circle cx="20" cy="25" r="1.5" fill="#ff0000" />
            <circle cx="25" cy="22" r="2" fill="#ff0000" />
            <circle cx="22" cy="30" r="1" fill="#ff0000" />
            <text x="35" y="30" font-family="Comic Sans MS, Arial" font-size="12" fill="#ff0000" transform="rotate(-5, 35, 30)">gecko_v1_final_FINAL.bmp</text>
          </svg>
        </div>

        <!-- Tab Navigation Bar - UI Requirement: SCROLLBAR FOR TABS -->
        <div class="tab-header">
            <button class="tab-btn active" onclick="switchTab(event, 'dns-panel')">⚡ Connection & DNS Checker</button>
            <button class="tab-btn" onclick="switchTab(event, 'ip-panel')">🌐 My IP Info</button>
            <button class="tab-btn" onclick="switchTab(event, 'whois-panel')">📋 WHOIS</button>
            <button class="tab-btn" onclick="switchTab(event, 'port-panel')">🔌 Port Scanner</button>
            <button class="tab-btn" onclick="switchTab(event, 'fp-panel')">🔍 Fingerprint</button>
            <button class="tab-btn" onclick="switchTab(event, 'pwd-panel')">🔑 Password Gen</button>
        </div>

        <div class="tab-content">
            <!-- TAB 1: DNS CHECKER -->
            <div id="dns-panel" class="tab-panel active">
                <div class="section">
                    <!-- DNS Requirement: Detect upstream DNS provider, not just local ASN -->
                    <h2>1. Active Connection & Upstream Route Trace (Beta)</h2>
                    <button class="action-btn" onclick="detectConnection()">Run Provider Trace</button>
                    <div id="connection-output" class="output-box">Click the button above to trace connection parameters and identify upstream resolver infrastructure...</div>
                </div>

                <div class="section">
                    <h2>2. Simple DNS Record Lookup</h2>
                    <div class="input-group">
                        <input type="text" id="domain-input" placeholder="e.g. google.com" value="google.com">
                        <select id="record-type">
                            <option value="A">A (IPv4)</option>
                            <option value="AAAA">AAAA (IPv6)</option>
                            <option value="MX">MX (Mail)</option>
                            <option value="TXT">TXT (Text/SPF)</option>
                            <option value="NS">NS (Nameservers)</option>
                            <option value="CNAME">CNAME (Alias)</option>
                        </select>
                    </div>
                    <button class="action-btn" onclick="lookupDNS()">Query DNS Record</button>
                    <div id="dns-output" class="output-box">DNS lookup results will appear here...</div>
                </div>
            </div>

            <!-- TAB 2: IP ADDRESS & GEOLOCATION CHECKER -->
            <div id="ip-panel" class="tab-panel">
                <div class="section">
                    <h2>IP Address & Geo Location Details</h2>
                    <button class="action-btn" onclick="fetchIPDetails()">Check IP Information</button>
                    <div id="ip-output" class="output-box">Click the button above to view public IP details and location map...</div>
                    
                    <div id="ip-map-container" class="map-container">
                        <iframe id="ip-map" src=""></iframe>
                    </div>
                </div>
            </div>

            <!-- TAB 3: WHOIS LOOKUP -->
            <div id="whois-panel" class="tab-panel">
                <div class="section">
                    <!-- WHOIS Requirement: Clean Prohibited Information messages -->
                    <h2>Domain Registration Data (RDAP)</h2>
                    <div class="input-group">
                        <input type="text" id="whois-input" placeholder="e.g. wikipedia.org" value="github.com">
                    </div>
                    <button class="action-btn" onclick="fetchWHOIS()">Lookup Domain WHOIS</button>
                    <div id="whois-output" class="output-box">Enter a domain above to query registration records...</div>
                </div>
            </div>

            <!-- TAB 4: WAN PORT SCANNER -->
            <div id="port-panel" class="tab-panel">
                <div class="section">
                    <!-- Port Scanner Requirement: Clearer labels than Allowed/Blocked -->
                    <h2>My WAN Port Scan</h2>
                    <div class="input-group">
                        <input type="text" id="port-target" value="Target: Detecting WAN IP..." readonly>
                    </div>
                    <button class="action-btn" onclick="scanMyWanPorts()">Check for common open ports</button>
                    <div id="port-output" class="output-box">Click the button above to detect your public WAN IP and test common service ports...</div>
                </div>
            </div>

            <!-- TAB 5: BROWSER FINGERPRINT -->
            <div id="fp-panel" class="tab-panel">
                <div class="section">
                    <h2>Device & Browser Signals</h2>
                    <button class="action-btn" onclick="generateFingerprint()">Generate Device Fingerprint</button>
                    <div id="fp-output" class="output-box">Click the button above to calculate browser identity signals...</div>
                </div>
            </div>

            <!-- TAB 6: PASSWORD GENERATOR -->
            <div id="pwd-panel" class="tab-panel">
                <div class="section">
                    <h2>Cryptographically Secure Password & Passphrase Generator</h2>

                    <div class="password-display-wrapper">
                        <div id="pwd-result" class="password-display">Click Generate below...</div>
                        <button class="secondary-btn copy-btn" id="copy-btn" onclick="copyPassword()">Copy 📋</button>
                    </div>

                    <div class="strength-meter">
                        <div class="strength-label">
                            <span>Entropy / Strength: <strong id="strength-text" style="color: var(--text-color);">-</strong></span>
                            <span id="entropy-bits">0 bits</span>
                        </div>
                        <div class="strength-bar-bg">
                            <div id="strength-bar" class="strength-bar-fill"></div>
                        </div>
                    </div>

                    <br>

                    <div class="controls-grid">
                        <div class="control-item">
                            <label for="pwd-mode">Generation Mode</label>
                            <select id="pwd-mode" onchange="togglePasswordMode()">
                                <option value="characters">Random Characters</option>
                                <option value="passphrase">Memorable Passphrase (Words)</option>
                            </select>
                        </div>

                        <div class="control-item mode-char-option">
                            <label for="pwd-length">Length: <span id="pwd-len-val" class="range-val">20</span></label>
                            <div class="range-slider-container">
                                <input type="range" id="pwd-length" min="6" max="128" value="20" oninput="document.getElementById('pwd-len-val').textContent = this.value; generatePassword();">
                            </div>
                        </div>

                        <div class="control-item mode-word-option" style="display: none;">
                            <label for="pwd-word-count">Word Count: <span id="pwd-words-val" class="range-val">4</span></label>
                            <div class="range-slider-container">
                                <input type="range" id="pwd-word-count" min="3" max="12" value="4" oninput="document.getElementById('pwd-words-val').textContent = this.value; generatePassword();">
                            </div>
                        </div>

                        <div class="control-item mode-char-option">
                            <label for="pwd-case-style">Formatting Style</label>
                            <select id="pwd-case-style" onchange="generatePassword()">
                                <option value="default">Standard / Default</option>
                                <option value="lowercase">all lowercase</option>
                                <option value="uppercase">ALL UPPERCASE</option>
                                <option value="alternating">aLtErNaTiNg CaSe</option>
                                <option value="leetspeak">L33tSp34k (Substitutions)</option>
                            </select>
                        </div>

                        <div class="control-item mode-word-option" style="display: none;">
                            <label for="pwd-word-case">Word Capitalization Style</label>
                            <select id="pwd-word-case" onchange="generatePassword()">
                                <option value="title">Title Case (Word-Word)</option>
                                <option value="upper">UPPERCASE (WORD-WORD)</option>
                                <option value="lower">lowercase (word-word)</option>
